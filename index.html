<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Black Screen & Color Play</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #fff;
        }

        /* Main Game Screen Overlay */
        .black-screen {
            background-color: rgba(0, 0, 0, 0.95);
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            transition: background-color 0.4s ease-in-out;
            display: none;
        }

        .black-screen.active {
            display: block;
        }

        /* Minimalistic Single Card Menu Overlay */
        .game-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, rgba(10,10,10,0.95), rgba(20,20,20,0.98));
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .menu-container {
            text-align: center;
            max-width: 380px;
            width: 90%;
            background: rgba(22, 22, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        .game-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 18px;
            background: linear-gradient(45deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background: #fff;
            color: #000;
        }

        .menu-btn.primary {
            background: #28a745;
            border-color: #28a745;
        }

        .menu-btn.primary:hover {
            background: #218838;
            color: #fff;
        }

        /* Collapsible Panels Style */
        .collapsible-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 0 10px;
            margin-bottom: 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
        }

        .collapsible-panel.open {
            max-height: 120px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        /* Compact Settings Row Inside Panel */
        .setting-row {
            display: flex;
            gap: 8px;
        }

        .setting-group {
            flex: 1;
            text-align: left;
        }

        .setting-group label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 3px;
        }

        .setting-group input {
            width: 100%;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 5px;
            font-size: 13px;
            text-align: center;
        }

        /* Help Content Style */
        .help-content {
            font-size: 12px;
            color: #bbb;
            text-align: left;
            line-height: 1.6;
        }

        .help-content kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
            color: #fff;
            font-size: 11px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- Game Screen Overlay -->
    <div class="black-screen" id="blackScreen"></div>

    <!-- Minimalistic Single Card Menu -->
    <div class="game-menu-overlay" id="gameMenuOverlay">
        <div class="menu-container">
            <h1 class="game-title">MINIMALIST BLACK SCREEN & COLOR PLAY</h1>

            <button class="menu-btn primary" id="playResumeBtn" onclick="handlePlayResume()">▶ Play Game</button>
            <button class="menu-btn" onclick="startAutoPlayMode()">⚡ Auto Play</button>
            <button class="menu-btn" onclick="newGame()">✨ New Start</button>
            
            <!-- Settings Toggle Button -->
            <button class="menu-btn" onclick="togglePanel('settingsPanel')">⚙️ Settings</button>

            <!-- Collapsible Settings Panel -->
            <div class="collapsible-panel" id="settingsPanel">
                <div class="setting-row">
                    <div class="setting-group">
                        <label>Interval (s)</label>
                        <input type="number" id="intervalInput" value="3" min="1" max="60">
                    </div>
                    <div class="setting-group">
                        <label>Iterations</label>
                        <input type="number" id="iterationsInput" value="10" min="1" max="100">
                    </div>
                </div>
            </div>

            <!-- Help / Keyboard Shortcuts Toggle Button -->
            <button class="menu-btn" onclick="togglePanel('helpPanel')">❓ Help & Shortcuts</button>

            <!-- Collapsible Help Panel -->
            <div class="collapsible-panel" id="helpPanel">
                <div class="help-content">
                    <div>👉 <kbd>→</kbd> Next Color</div>
                    <div>👉 <kbd>←</kbd> Previous Color</div>
                    <div>👉 <kbd>F</kbd> Toggle Fullscreen</div>
                </div>
            </div>
        </div>
    </div>

    <!-- External Stack data structure script -->
    <script src="./stack.js"></script>

    <script>
        // 1. First, declare all global variables and DOM elements
        let colors = null;
        let isGameRunning = false;
        let autoPlayIntervalId = null;
        let count = 0;

        let blackScreen, gameMenuOverlay, playResumeBtn;

        // Ensure DOM is fully loaded before referencing elements and initializing Stack
        document.addEventListener('DOMContentLoaded', () => {
            colors = new Stack();
            blackScreen = document.getElementById('blackScreen');
            gameMenuOverlay = document.getElementById('gameMenuOverlay');
            playResumeBtn = document.getElementById('playResumeBtn');
        });

        // 2. Function definitions
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            if (panel) {
                panel.classList.toggle('open');
            }
        }

        function handlePlayResume() {
            isGameRunning = true;
            if (gameMenuOverlay) gameMenuOverlay.classList.add('hidden');
            if (blackScreen) blackScreen.classList.add('active');

            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Fullscreen error: ${err.message}`);
            });
        }

        function newGame() {
            if (typeof Stack !== 'undefined') {
                colors = new Stack();
            }
            if (blackScreen) {
                blackScreen.style.backgroundColor = `rgba(0, 0, 0, 0.95)`;
            }
            handlePlayResume();
        }

        function startAutoPlayMode() {
            let intervalSec = parseInt(document.getElementById('intervalInput').value) || 3;
            let totalIterations = parseInt(document.getElementById('iterationsInput').value) || 10;
            let currentIteration = 0;

            handlePlayResume();

            autoPlayIntervalId = setInterval(() => {
                if (currentIteration >= totalIterations) {
                    clearInterval(autoPlayIntervalId);
                    exitGameToMenu();
                    return;
                }
                
                randomLiteColor();
                const generatedColor = localStorage.getItem('generatedColor');
                if (blackScreen) blackScreen.style.backgroundColor = generatedColor;
                if (colors) colors.push(generatedColor);

                currentIteration++;
            }, intervalSec * 1000);
        }

        function exitGameToMenu() {
            if (autoPlayIntervalId) {
                clearInterval(autoPlayIntervalId);
            }

            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => console.error(err));
            }

            if (blackScreen) blackScreen.classList.remove('active');
            if (gameMenuOverlay) gameMenuOverlay.classList.remove('hidden');
            if (playResumeBtn) playResumeBtn.innerText = "🔄 Resume Game";
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Fullscreen error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function randomLiteColor() {
            let r = Math.floor(Math.random() * 255);
            let g = Math.floor(Math.random() * 255);
            let b = Math.floor(Math.random() * 255);
            let color = `rgb(${r}, ${g}, ${b})`;
            
            if (isLiteColor(color)) {
                if (count > 0) {
                    count = 0;
                }
                localStorage.setItem('generatedColor', color);
                return;
            } else {
                count++;
                randomLiteColor();
            }
        }

        function isLiteColor(color) {
            let rgb = color.replace('rgb(', '').replace(')', '').split(',');
            let r = rgb[0];
            let g = rgb[1];
            let b = rgb[2];
            let brightness = Math.round(((parseInt(r) * 299) + (parseInt(g) * 587) + (parseInt(b) * 114)) / 1000);
            return brightness > 155;
        }

        // 3. Event Listeners
        document.addEventListener('fullscreenchange', function () {
            if (!document.fullscreenElement && isGameRunning) {
                exitGameToMenu();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.keyCode == 70 && isGameRunning) {
                toggleFullScreen();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.keyCode == 39 && isGameRunning) {
                randomLiteColor();
                const generatedColor = localStorage.getItem('generatedColor');
                if (blackScreen) blackScreen.style.backgroundColor = generatedColor;
                if (colors) colors.push(generatedColor);
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.keyCode == 37 && isGameRunning) {
                if (!colors || colors.isEmpty()) {
                    if (blackScreen) blackScreen.style.backgroundColor = `rgba(0, 0, 0, 0.95)`;
                    return;
                } else {
                    colors.pop();
                    let peekedColor = colors.peek();
                    if (peekedColor == null) {
                        peekedColor = `rgba(0, 0, 0, 0.95)`;
                    }
                    if (blackScreen) blackScreen.style.backgroundColor = peekedColor;
                }
            }
        });
    </script>
</body>

</html>
