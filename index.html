<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Black Screen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .black-screen {
            background-color: rgba(0, 0, 0, 0.9);
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            /* Smooth background color transition */
            transition: background-color 0.4s ease-in-out;
            cursor: pointer;
        }

        /* Minimal Tour Guide Popup (Disappears after use or timeout) */
        .tour-guide {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            color: #f1f1f1;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 0.5px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
        }

        .tour-guide.fade-out {
            opacity: 0;
            transform: translate(-50%, 20px);
            pointer-events: none;
        }

        .tour-step {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tour-guide kbd {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            color: #fff;
        }

        .tour-divider {
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="black-screen"></div>

    <!-- Minimalist Tour Guide that vanishes completely to keep screen clean -->
    <div class="tour-guide" id="tourGuide">
        <div class="tour-step"><span>👉 <kbd>→</kbd> / <kbd>←</kbd> Colors</span></div>
        <div class="tour-divider"></div>
        <div class="tour-step"><span>⚡ Double-Click: Fullscreen</span></div>
    </div>

    <!-- External Stack data structure script -->
    <script src="./stack.js"></script>

    <script>
        // Initialize stack to keep track of color history
        let colors = new Stack();
        console.error(colors);

        const tourGuide = document.getElementById('tourGuide');

        /**
         * Function to dismiss the tour guide gracefully
         */
        function dismissTour() {
            if (!tourGuide.classList.contains('fade-out')) {
                tourGuide.classList.add('fade-out');
                // Completely remove from DOM after transition
                setTimeout(() => tourGuide.remove(), 500);
            }
        }

        // Auto-dismiss tour guide after 4 seconds so the screen stays pristine
        let autoDismissTimer = setTimeout(dismissTour, 4000);

        /**
         * Event Listener: Key 'F' (keyCode 70) or Double Click/Tap for Fullscreen Toggle
         */
        function toggleFullScreen() {
            dismissTour();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.keyCode == 70) {
                toggleFullScreen();
            }
        });

        // Double click / tap support for full screen toggle
        document.addEventListener('dblclick', function () {
            toggleFullScreen();
        });

        /**
         * Event Listener: Right Arrow Key (keyCode 39)
         * Generates a new random light color, applies it, and pushes to the stack.
         */
        document.addEventListener('keydown', function (e) {
            if (e.keyCode == 39) {
                dismissTour();
                randomLiteColor();
                const generatedColor = localStorage.getItem('generatedColor');
                document.querySelector('.black-screen').style.backgroundColor = generatedColor;
                colors.push(generatedColor);
            }
        });

        /**
         * Event Listener: Left Arrow Key (keyCode 37)
         * Pops from the stack to revert to the previous color.
         */
        document.addEventListener('keydown', function (e) {
            if (e.keyCode == 37) {
                dismissTour();
                if (colors.isEmpty()) {
                    document.querySelector('.black-screen').style.backgroundColor = `rgba(0, 0, 0, 0.9)`;
                    return;
                } else {
                    colors.pop();
                    let peekedColor = colors.peek();
                    if (peekedColor == null) {
                        peekedColor = `rgba(0, 0, 0, 0.9)`;
                    }
                    document.querySelector('.black-screen').style.backgroundColor = peekedColor;
                }
            }
        });

        let count = 0;

        /**
         * Generates a random RGB color and checks if it's light enough using brightness formula.
         * Recursively calls itself until a light color is found.
         */
        function randomLiteColor() {
            let r = Math.floor(Math.random() * 255);
            let g = Math.floor(Math.random() * 255);
            let b = Math.floor(Math.random() * 255);
            let color = `rgb(${r}, ${g}, ${b})`;
            
            if (isLiteColor(color)) {
                if (count > 0) {
                    console.error(`Attempts taken: ${count}`);
                    count = 0;
                }
                localStorage.setItem('generatedColor', color);
                return;
            } else {
                count++;
                randomLiteColor();
            }
        }

        /**
         * Calculates perceived brightness of an RGB color using standard YIQ formula.
         * Returns true if the brightness value is greater than 155 (making it a light color).
         */
        function isLiteColor(color) {
            let rgb = color.replace('rgb(', '').replace(')', '').split(',');
            let r = rgb[0];
            let g = rgb[1];
            let b = rgb[2];
            let brightness = Math.round(((parseInt(r) * 299) + (parseInt(g) * 587) + (parseInt(b) * 114)) / 1000);
            return brightness > 155;
        }
    </script>
</body>

</html>
